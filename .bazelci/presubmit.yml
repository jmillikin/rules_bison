---
validate_config: 1
buildifier:
  version: 6.1.2
  warnings: "-attr-cfg"
tasks:
  rockylinux8:
    environment:
      CC: gcc
    build_targets: ["//..."]
    test_targets:
      - "//..."
      - "//tests:all_versions"
  ubuntu_2204_gcc:
    platform: ubuntu2204
    environment:
      CC: gcc
    build_targets: ["//..."]
    test_targets:
      - "//..."
      - "//tests:all_versions"
  ubuntu_2204_clang:
    platform: ubuntu2204
    environment:
      CC: clang
    build_targets: ["//..."]
    test_targets:
      - "//..."
      - "//tests:all_versions"
  macos:
    build_targets: ["//..."]
    test_targets:
      - "//..."
      - "//tests:all_versions"
  windows:
    build_flags:
      - "--enable_runfiles"
    build_targets: ["//..."]
    test_targets:
      - "//..."
      - "//tests:all_versions"
  check_docs_match_stardoc:
    platform: ubuntu2204
    test_targets:
      - "//tests/docs_test"
